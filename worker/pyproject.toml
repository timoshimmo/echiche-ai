[project]
name = "echiche-worker"
version = "0.5.0"
description = "Echiche AI orchestration worker (ADR-001, ADR-006): claims runs from Postgres and executes them durably."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# ADR-001 D3. Pinned exactly; uv.lock pins the full tree.
dependencies = [
  "pydantic==2.14.1",
  "psycopg[binary]==3.3.6",
  "openai==3.29.0",
]

[project.scripts]
echiche-worker = "echiche_worker.__main__:main"

[dependency-groups]
dev = [
  "pyright==1.1.407",
  "pytest==8.4.2",
  "ruff==0.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echiche_worker"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a migrated database; run them with `pytest -m integration`.
addopts = "-ra --strict-markers -m 'not integration and not live'"
markers = [
  "integration: needs WORKER_TEST_DATABASE_URL and TEST_ADMIN_DATABASE_URL (disposable, migrated database)",
  "live: makes a REAL, billed provider call; needs ECHICHE_LIVE_OPENAI=1 and OPENAI_API_KEY. Never in CI.",
]
