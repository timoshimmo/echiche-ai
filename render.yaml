# Render Blueprint (ADR-005). Region and plans are chosen once at creation:
# Render cannot move a service to another region later.
#
# Secrets are `sync: false`: Render asks for them when the Blueprint is first created
# and never reads them from this file. See docs/runbooks/render-deploy.md.
# Migrations are NOT run here (that would put admin DB credentials in the web
# service's environment); apply them first, as the runbook describes.

services:
  - type: web
    name: echiche-web
    runtime: node
    region: frankfurt
    # Free (0.1 CPU, 512 MB; measured ~230 MB in use): sleeps after 15 minutes without traffic and
    # takes about a minute to wake. Fine for staging. For partners, use 0.5c-512mb (Starter, $7/month)
    # so nobody waits for a cold start, or 1c-2g (Standard, $25) as originally planned (ADR-005).
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    # No maxShutdownDelaySeconds here: Render rejects it on free services (its default is 30 s anyway).
    # Add `maxShutdownDelaySeconds: 30` back when moving the web service to a paid plan.
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL          # as echiche_web (never postgres / a service role)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: APP_ORIGIN            # e.g. https://echiche-web.onrender.com or your domain
        sync: false
      # Spend ceilings (M8, F1): each run's cap and each resume are reserved in full, per user and
      # for everyone, over a rolling 24 hours. Set them to what you are willing to pay per day.
      - key: USER_DAILY_SPEND_LIMIT_USD   # pilot values approved 2026-10-28 (ADR-011)
        value: "2"
      - key: GLOBAL_DAILY_SPEND_LIMIT_USD
        value: "15"

  - type: worker
    name: echiche-worker
    runtime: docker
    region: frankfurt
    # Background workers have no free plan on Render: Starter ($7/month) is the smallest.
    plan: 0.5c-512mb
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .            # repo root: the image also contains prompts/runtime
    # On SIGTERM the worker stops claiming and releases or finishes its current stage.
    # Keep this above WORKER_STAGE_TIMEOUT_SECONDS.
    maxShutdownDelaySeconds: 120
    envVars:
      - key: DATABASE_URL          # as echiche_worker
        sync: false
      - key: WORKER_STAGE_TIMEOUT_SECONDS   # a model stage may make 2 calls (one repair)
        value: "110"
      - key: WORKER_LEASE_SECONDS
        value: "60"
      # Reasoning provider (ADR-007). "deterministic" = demo mode, no model calls, no cost.
      # Switch to "openai" only after OPENAI_API_KEY is set (Render dashboard, never in git).
      - key: REASONING_PROVIDER
        value: deterministic
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL           # must have a verified price in worker/src/echiche_worker/llm.py
        value: gpt-6.1-sol
      - key: OPENAI_DATA_RESIDENCY  # "eu" requires OpenAI's approval for EU data residency first
        value: global
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "4000"
      # Adaptive compute (ADR-010). Optional: a stronger model used only for synthesis in "deep" runs
      # when verification found a contradiction or the critique rated something high-severity.
      # Must have a verified price in llm.py and differ from OPENAI_MODEL. Unset = never escalate
      # (the run records that escalation was justified but not available). Costs more per call.
      - key: OPENAI_ESCALATION_MODEL
        sync: false
      # Research (ADR-008). "none" = no web research. "brave" needs REASONING_PROVIDER=openai
      # and BRAVE_SEARCH_API_KEY (Render dashboard, never in git).
      - key: RESEARCH_PROVIDER
        value: none
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: RESEARCH_MAX_QUERIES       # searches per run (also capped by the run's research budget)
        value: "3"
      - key: RESEARCH_MAX_PAGES         # pages kept as sources per run
        value: "6"
