<!doctype html><html><head><title>Clinic software adoption in 2014</title>
<meta name="dc.date" content="2014-06-01"><meta property="og:site_name" content="Archive Health Weekly"></head>
<body><article>
<p>In 2014, fewer than 20 percent of small clinics used any paid scheduling software, and most relied on paper appointment books.</p>
<p>Clinic owners at the time said a monthly subscription for scheduling software was hard to justify for practices with one or two practitioners.</p>
</article></body></html>
