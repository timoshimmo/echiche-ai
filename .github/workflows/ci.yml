name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, unit tests, build, audit, bundle scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Build runs without any runtime configuration: config is validated at server start, not build.
      - run: npm run build
      - name: Client bundle must not contain server configuration
        run: |
          if grep -rlE "DATABASE_URL|SUPABASE_URL|SUPABASE_PUBLISHABLE_KEY|sb_secret_|service_role|OPENAI_API_KEY" .next/static; then
            echo "::error::Server configuration found in the client bundle"; exit 1
          fi
      # Production dependencies must be free of high/critical advisories.
      - run: npm audit --omit=dev --audit-level=high

  integration:
    name: Integration + RLS (plain Postgres 16 with test shim)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: echiche_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d echiche_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-only-placeholder@localhost:5432/echiche_test
      DATABASE_URL: postgresql://echiche_web:test-only-password@localhost:5432/echiche_test
      WORKER_TEST_DATABASE_URL: postgresql://echiche_worker:test-only-password@localhost:5432/echiche_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: npm ci
      - run: uv python install && uv sync --locked
        working-directory: worker
      - run: npm run test:db:prepare
      # Re-running must be a no-op (migrations already applied).
      - run: npm run test:db:prepare
      # Web repository + RLS tests, and the cross-language E2E (web queues -> Python worker -> web reads).
      - run: npm run test:integration
      # Worker durability: crash/resume, concurrent claims, leases, cancellation, budgets, timeouts.
      - run: uv run pytest -m integration
        working-directory: worker

  supabase-stack:
    name: Integration + RLS + auth revocation (real local Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Starts Postgres, Auth, etc. in Docker and applies supabase/migrations.
      - run: npx supabase start
      - name: Export local stack connection details
        run: |
          npx supabase status -o env | sed -E 's/^([A-Z_]+)="?([^"]*)"?$/\1=\2/' >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: uv python install && uv sync --locked
        working-directory: worker
      - name: Prepare test roles
        run: |
          echo "TEST_ADMIN_DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$(echo "$DB_URL" | sed -E 's#//[^@]+@#//echiche_web:test-only-password@#')" >> "$GITHUB_ENV"
          echo "WORKER_TEST_DATABASE_URL=$(echo "$DB_URL" | sed -E 's#//[^@]+@#//echiche_worker:test-only-password@#')" >> "$GITHUB_ENV"
          TEST_ADMIN_DATABASE_URL="$DB_URL" npm run test:db:prepare
      - run: npm run test:integration
      - run: uv run pytest -m integration
        working-directory: worker
      - run: node scripts/ci/verify-auth-revocation.mjs
      - if: always()
        run: npx supabase stop --no-backup

  worker:
    name: Worker (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: uv python install
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      # Committed contracts/ JSON Schemas must match the Pydantic models.
      - run: uv run python -m echiche_worker.contracts --check
      # M7 regression gate: the fake benchmark (scripted model, no network, no cost) must keep every
      # guardrail invariant in evals/gates.v1.json. Exits 1 on any failure; the report is in the log.
      - run: uv run python -m evals.run
      # The production image builds (repo-root context) and its entry point starts (config check only;
      # no DB, no network). Both load the routing policy baked into the image; the second also loads the
      # prompt registry and the escalation client with dummy keys.
      - run: docker build -f worker/Dockerfile -t echiche-worker:ci .
        working-directory: .
      - run: docker run --rm -e DATABASE_URL=postgresql://w:placeholder@db.invalid/postgres echiche-worker:ci /app/.venv/bin/echiche-worker --check-config
      - run: >-
          docker run --rm -e DATABASE_URL=postgresql://w:placeholder@db.invalid/postgres
          -e REASONING_PROVIDER=openai -e OPENAI_API_KEY=sk-ci-placeholder-not-a-key
          -e RESEARCH_PROVIDER=brave -e BRAVE_SEARCH_API_KEY=brave-ci-placeholder-not-a-key
          -e OPENAI_ESCALATION_MODEL=gpt-6-astra
          echiche-worker:ci /app/.venv/bin/echiche-worker --check-config
